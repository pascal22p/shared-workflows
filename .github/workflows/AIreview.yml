name: Scala AI Code Review

on:
  workflow_call:
    inputs:
      run_id:
        description: "The Scala CI run ID that triggered this review"
        required: true
        type: string

      model:
        description: "The model name as defined in OVH"
        required: true
        type: string

      reasoning_effort:
        description: "Reasoning depth"
        required: true
        type: string

    secrets:
      OVH_AI_ENDPOINTS_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  review:
    name: Scala AI Review
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # Find the PR
      # ============================================================

      - name: Get PR information
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          RUN_JSON=$(gh api \
            "repos/${REPOSITORY}/actions/runs/${RUN_ID}")

          PR_NUMBER=$(echo "$RUN_JSON" | jq -r '.pull_requests[0].number')

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No pull request found."
            exit 1
          fi

          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Reviewing PR #${PR_NUMBER}"

      # ============================================================
      # Get PR metadata
      # ============================================================

      - name: Get PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail

          gh api \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
            > pr.json

          BASE_SHA=$(jq -r '.base.sha' pr.json)
          HEAD_SHA=$(jq -r '.head.sha' pr.json)

          echo "BASE_SHA=${BASE_SHA}" >> "$GITHUB_ENV"
          echo "HEAD_SHA=${HEAD_SHA}" >> "$GITHUB_ENV"

          echo "Base: ${BASE_SHA}"
          echo "Head: ${HEAD_SHA}"

      # ============================================================
      # Download SemanticDB produced by Scala CI
      # ============================================================

      - name: Download SemanticDB
        uses: actions/download-artifact@v4
        with:
          name: semanticdb
          path: semanticdb
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Inspect SemanticDB
        run: |
          echo "SemanticDB files:"

          find semanticdb \
            -type f \
            -name "*.semanticdb" \
            -print || true

          COUNT=$(find semanticdb \
            -type f \
            -name "*.semanticdb" \
            | wc -l)

          echo
          echo "SemanticDB file count: ${COUNT}"

      # ============================================================
      # Get changed files
      # ============================================================

      - name: Get changed files
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail

          gh api \
            --paginate \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            > pr-files.json

          jq -r '.[].filename' pr-files.json \
            > changed-files.txt

          echo "Changed files:"
          cat changed-files.txt

      # ============================================================
      # Capture complete BEFORE and AFTER Scala files
      #
      # No checkout.
      # No git.
      # No PR code execution.
      # ============================================================

      - name: Capture complete before and after files
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ env.BASE_SHA }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
        run: |
          set -euo pipefail

          rm -rf review-context

          mkdir -p review-context/before
          mkdir -p review-context/after

          while IFS= read -r file; do

            [ -z "$file" ] && continue

            case "$file" in
              *.scala | *.scala.html | *.js | *.css | *.conf)
                ;;
              *)
                continue
                ;;
            esac

            safe_name=$(echo "$file" | sed 's#[/ ]#__#g')

            echo "Reading ${file}"

            # BEFORE

            if gh api \
              "repos/${REPOSITORY}/contents/${file}?ref=${BASE_SHA}" \
              > /tmp/before.json 2>/dev/null; then

              if jq -e '.content' /tmp/before.json >/dev/null 2>&1; then
                jq -r '.content' /tmp/before.json \
                  | tr -d '\n' \
                  | base64 -d \
                  > "review-context/before/${safe_name}"
              else
                echo "[FILE DID NOT EXIST AT BASE]" \
                  > "review-context/before/${safe_name}"
              fi

            else
              echo "[FILE DID NOT EXIST AT BASE]" \
                > "review-context/before/${safe_name}"
            fi

            # AFTER

            if gh api \
              "repos/${REPOSITORY}/contents/${file}?ref=${HEAD_SHA}" \
              > /tmp/after.json 2>/dev/null; then

              if jq -e '.content' /tmp/after.json >/dev/null 2>&1; then
                jq -r '.content' /tmp/after.json \
                  | tr -d '\n' \
                  | base64 -d \
                  > "review-context/after/${safe_name}"
              else
                echo "[UNABLE TO READ FILE]" \
                  > "review-context/after/${safe_name}"
              fi

            else
              echo "[FILE DELETED BY PR]" \
                > "review-context/after/${safe_name}"
            fi

          done < changed-files.txt

      # ============================================================
      # Get complete PR diff
      # ============================================================

      - name: Get complete PR diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail

          gh api \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
            -H "Accept: application/vnd.github.v3.diff" \
            > review-context/pr.diff

          echo "Diff size:"
          wc -c review-context/pr.diff

      # ============================================================
      # Run the implementation stored in shared-workflows
      # ============================================================

      - name: Scala AI review
        uses: pascal22p/shared-workflows/actions/scala-ai-review@v2
        with:
          model: ${{ inputs.model }}
          reasoning_effort: ${{ inputs.reasoning_effort }}
          ovh_api_key: ${{ secrets.OVH_AI_ENDPOINTS_API_KEY }}
          pr_number: ${{ steps.pr.outputs.number }}

      # ============================================================
      # Save review context
      # ============================================================

      - name: Upload review context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scala-ai-review
          path: |
            changed-files.txt
            pr.json
            pr-files.json
            review-context/
          retention-days: 7