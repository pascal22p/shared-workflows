name: Scala AI Code Review

on:
  workflow_call:
    inputs:
      run_id:
        description: "The Scala CI run ID that triggered this review"
        required: true
        type: string

      model:
        description: "The model name as defined in OVH"
        required: true
        type: string

      reasoning_effort:
        description: "Reasoning depth"
        required: true
        type: string

    secrets:
      OVH_AI_ENDPOINTS_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:

  # ============================================================
  # Prepare review context
  # ============================================================

  prepare:
    name: Prepare Scala AI Review
    runs-on: ubuntu-24.04

    outputs:
      pr_number: ${{ steps.pr.outputs.number }}

    steps:

      # ============================================================
      # Find the PR
      # ============================================================

      - name: Get PR information
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          RUN_JSON=$(gh api \
            "repos/${REPOSITORY}/actions/runs/${RUN_ID}")

          PR_NUMBER=$(echo "$RUN_JSON" | jq -r '.pull_requests[0].number')

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No pull request found."
            exit 1
          fi

          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Reviewing PR #${PR_NUMBER}"

      # ============================================================
      # Get PR metadata
      # ============================================================

      - name: Get PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail

          gh api \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
            > pr.json

          BASE_SHA=$(jq -r '.base.sha' pr.json)
          HEAD_SHA=$(jq -r '.head.sha' pr.json)

          echo "BASE_SHA=${BASE_SHA}" >> "$GITHUB_ENV"
          echo "HEAD_SHA=${HEAD_SHA}" >> "$GITHUB_ENV"

          echo "Base: ${BASE_SHA}"
          echo "Head: ${HEAD_SHA}"

      # ============================================================
      # Download scripts
      # ============================================================

      - name: Download review scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p review-scripts

          for script in get_context_files.sh read_changed_files.sh read_additional_files.sh; do
            gh api \
              "repos/pascal22p/shared-workflows/contents/actions/scala-ai-review/scripts/${script}?ref=main" \
              --jq '.content' \
              | tr -d '\n' \
              | base64 -d \
              > "review-scripts/${script}"

            chmod +x "review-scripts/${script}"
          done

      # ============================================================
      # Get changed files
      # ============================================================

      - name: Get changed files
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          bash review-scripts/get_context_files.sh

      # ============================================================
      # Capture complete BEFORE and AFTER Scala files
      #
      # No checkout.
      # No git.
      # No PR code execution.
      # ============================================================

      - name: Capture complete before and after files
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ env.BASE_SHA }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
        run: |
          bash review-scripts/read_changed_files.sh

      - name: Capture additional files
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ env.BASE_SHA }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
        run: |
          bash review-scripts/read_additional_files.sh

      # ============================================================
      # Get complete PR diff
      # ============================================================

      - name: Get complete PR diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail

          gh api \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
            -H "Accept: application/vnd.github.v3.diff" \
            > review-context/pr.diff

          echo "Diff size:"
          wc -c review-context/pr.diff

      # ============================================================
      # Save review context for both reviewers
      # ============================================================

      - name: Upload review context
        uses: actions/upload-artifact@v4
        with:
          name: scala-ai-review-context
          path: |
            changed-files.txt
            pr.json
            pr-files.json
            review-context/
          retention-days: 7


  # ============================================================
  # Implementation review
  # ============================================================

  code-review:
    name: Scala AI Code Review
    needs: prepare
    runs-on: ubuntu-24.04

    steps:

      - name: Download review context
        uses: actions/download-artifact@v4
        with:
          name: scala-ai-review-context

      - name: Scala AI review
        uses: pascal22p/shared-workflows/actions/scala-ai-review@main
        with:
          model: ${{ inputs.model }}
          reasoning_effort: ${{ inputs.reasoning_effort }}
          ovh_api_key: ${{ secrets.OVH_AI_ENDPOINTS_API_KEY }}
          pr_number: ${{ needs.prepare.outputs.pr_number }}


  # ============================================================
  # Test-only review
  # ============================================================

  test-review:
    name: Scala AI Test Review
    needs: prepare
    runs-on: ubuntu-24.04

    steps:

      - name: Download review context
        uses: actions/download-artifact@v4
        with:
          name: scala-ai-review-context

      - name: Scala AI test review
        uses: pascal22p/shared-workflows/actions/scala-ai-test-review@main
        with:
          model: ${{ inputs.model }}
          reasoning_effort: ${{ inputs.reasoning_effort }}
          ovh_api_key: ${{ secrets.OVH_AI_ENDPOINTS_API_KEY }}
          pr_number: ${{ needs.prepare.outputs.pr_number }}