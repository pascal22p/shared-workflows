name: Scala AI Code Review

on:
  workflow_call:
    inputs:
      run_id:
        description: "The Scala CI run ID that triggered this review"
        required: true
        type: string

      model:
        description: "The model name as defined in OVH"
        required: true
        type: string

      reasoning_effort:
        description: "Reasoning depth"
        required: true
        type: string

      temperature:
        description: "Temperature for the AI model"
        required: false
        type: string
        default: "0.2"

    secrets:
      OVH_AI_ENDPOINTS_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:

  # ============================================================
  # Prepare review context
  # ============================================================

  prepare:
    name: Prepare Scala AI Review
    runs-on: ubuntu-24.04

    outputs:
      pr_number: ${{ steps.pr.outputs.number }}

    steps:

      - name: Get PR information
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
  
          RUN_JSON=$(gh api \
            "repos/${REPOSITORY}/actions/runs/${RUN_ID}")
  
          PR_NUMBER=$(echo "$RUN_JSON" | jq -r '.pull_requests[0].number')
  
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No pull request found."
            exit 1
          fi
  
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Prepare review context
        uses: pascal22p/shared-workflows/actions/scala-ai-review-prepare@main
        with:
          run_id: ${{ inputs.run_id }}
          pr_number: ${{ steps.pr.outputs.number }}

      - name: Upload review context
        uses: actions/upload-artifact@v7
        with:
          name: scala-ai-review-context
          path: |
            changed-files.txt
            pr.json
            pr-files.json
            review-context/
          retention-days: 7

  # ============================================================
  # Implementation review
  # ============================================================

  code-review:
    name: Scala AI Code Review
    needs: prepare
    runs-on: ubuntu-24.04

    steps:

      - name: Download review context
        uses: actions/download-artifact@v8
        with:
          name: scala-ai-review-context

      - name: Scala AI review
        uses: pascal22p/shared-workflows/actions/scala-ai-review@main
        with:
          model: ${{ inputs.model }}
          reasoning_effort: ${{ inputs.reasoning_effort }}
          temperature: ${{ inputs.temperature }}
          ovh_api_key: ${{ secrets.OVH_AI_ENDPOINTS_API_KEY }}
          pr_number: ${{ needs.prepare.outputs.pr_number }}

      - name: Cleanup Scala AI Review
        uses: pascal22p/shared-workflows/actions/scala-ai-review-cleanup@main
        with:
          model: ${{ inputs.model }}
          reasoning_effort: ${{ inputs.reasoning_effort }}
          temperature: ${{ inputs.temperature }}
          ovh_api_key: ${{ secrets.OVH_AI_ENDPOINTS_API_KEY }}
          review_file: review.json
          output_file: review-cleaned.json
          log_file: review-cleanup-log.json

      - name: Publish GitHub review
        uses: pascal22p/shared-workflows/actions/scala-ai-review-publish@main
        with:
          model: ${{ inputs.model }}
          reasoning_effort: ${{ inputs.reasoning_effort }}
          pr_number: ${{ needs.prepare.outputs.pr_number }}
          review_file: review-final.json

  # ============================================================
  # Test-only review
  # ============================================================

  test-review:
    name: Scala AI Test Review
    needs: prepare
    runs-on: ubuntu-24.04

    steps:

      - name: Download review context
        uses: actions/download-artifact@v8
        with:
          name: scala-ai-review-context

      - name: Scala AI test review
        uses: pascal22p/shared-workflows/actions/scala-ai-test-review@main
        with:
          model: ${{ inputs.model }}
          reasoning_effort: ${{ inputs.reasoning_effort }}
          temperature: ${{ inputs.temperature }}
          ovh_api_key: ${{ secrets.OVH_AI_ENDPOINTS_API_KEY }}
          pr_number: ${{ needs.prepare.outputs.pr_number }}


  # ============================================================
  # Frontend elements review
  # ============================================================

  frontend-review:
    name: Scala AI frontend Review
    needs: prepare
    runs-on: ubuntu-24.04

    steps:

      - name: Download review context
        uses: actions/download-artifact@v8
        with:
          name: scala-ai-review-context

      - name: Scala AI frontend review
        uses: pascal22p/shared-workflows/actions/scala-ai-frontend-review@main
        with:
          model: ${{ inputs.model }}
          reasoning_effort: ${{ inputs.reasoning_effort }}
          temperature: ${{ inputs.temperature }}
          ovh_api_key: ${{ secrets.OVH_AI_ENDPOINTS_API_KEY }}
          pr_number: ${{ needs.prepare.outputs.pr_number }}