name: Scala AI Review
description: Run the Scala AI review implementation

inputs:
  model:
    description: "The OVH model name"
    required: true
  reasoning_effort:
    description: "Reasoning depth"
    required: true
  ovh_api_key:
    description: "OVH AI Endpoints API key"
    required: true
  pr_number:
    description: "Pull request number"
    required: true

outputs:
  error:
    description: "Error message captured if any step failed (empty on success)"
    value: ${{ steps.outcome.outputs.error }}

runs:
  using: composite
  steps:
    - name: Install Python dependencies
      shell: bash
      run: |
        set -o pipefail
        python3 -m pip install --quiet protobuf openai 2>&1 | tee /tmp/ai-review-step.log
        status=${PIPESTATUS[0]}
        if [ "$status" -ne 0 ]; then
          echo "Install Python dependencies failed: $(tail -n 5 /tmp/ai-review-step.log | tr '\n' ' ')" > /tmp/ai-review-error.txt
          exit "$status"
        fi

    - name: Build AI review context
      shell: bash
      run: |
        set -o pipefail
        python3 "$GITHUB_ACTION_PATH/scripts/build_review_context.py" 2>&1 | tee /tmp/ai-review-step.log
        status=${PIPESTATUS[0]}
        if [ "$status" -ne 0 ]; then
          echo "Build AI review context failed: $(tail -n 5 /tmp/ai-review-step.log | tr '\n' ' ')" > /tmp/ai-review-error.txt
          exit "$status"
        fi

    - name: Debug AI review context
      shell: bash
      run: |
        echo "::group::Review parameters"
        
        echo "model: ${{ inputs.model }}"
        echo "reasoning_effort: ${{ inputs.reasoning_effort }}"
        echo "pr_number: ${{ inputs.pr_number }}"
        
        echo "::endgroup::"
        
        echo "::group::Review context directory"
        
        if [ -d "review-context" ]; then
          echo "✓ review-context exists"
          find review-context -type f -print
        else
          echo "✗ review-context DOES NOT EXIST"
        fi
        
        echo "::endgroup::"
        
        echo "::group::BEFORE files"
        
        if [ -d "review-context/before" ]; then
          for file in review-context/before/*; do
            [ -f "$file" ] || continue
        
            echo
            echo "========================================"
            echo "FILE: $file"
            echo "========================================"
        
            if [ -s "$file" ]; then
              echo "STATUS: ✓ present"
              echo "SIZE: $(wc -c < "$file") bytes"
              echo "LINES: $(wc -l < "$file")"
            else
              echo "STATUS: ⚠ present but EMPTY"
            fi
        
            echo "--- content ---"
            sed -n '1,50p' "$file"
            echo "--- end content ---"
          done
        else
          echo "✗ review-context/before DOES NOT EXIST"
        fi
        
        echo "::endgroup::"
        
        echo "::group::AFTER files"
        
        if [ -d "review-context/after" ]; then
          for file in review-context/after/*; do
            [ -f "$file" ] || continue
        
            echo
            echo "========================================"
            echo "FILE: $file"
            echo "========================================"
        
            if [ -s "$file" ]; then
              echo "STATUS: ✓ present"
              echo "SIZE: $(wc -c < "$file") bytes"
              echo "LINES: $(wc -l < "$file")"
            else
              echo "STATUS: ⚠ present but EMPTY"
            fi
        
            echo "--- content ---"
            sed -n '1,50p' "$file"
            echo "--- end content ---"
          done
        else
          echo "✗ review-context/after DOES NOT EXIST"
        fi
        
        echo "::endgroup::"
        
        echo "::group::Full context sent to LLM"
        
        if [ -f "review-context/full-context.md" ]; then
          echo "✓ full-context.md exists"
          echo "SIZE: $(wc -c < review-context/full-context.md) bytes"
          echo "LINES: $(wc -l < review-context/full-context.md)"
        
          if [ -s "review-context/full-context.md" ]; then
            echo "STATUS: ✓ contains content"
          else
            echo "STATUS: ⚠ EMPTY"
          fi
        
          echo
          cat review-context/full-context.md
        else
          echo "✗ full-context.md DOES NOT EXIST"
        fi
        
        echo "::endgroup::"

    - name: Review with OVH
      shell: bash
      env:
        OVH_AI_ENDPOINTS_API_KEY: ${{ inputs.ovh_api_key }}
        REVIEW_MODEL: ${{ inputs.model }}
        REASONING_EFFORT: ${{ inputs.reasoning_effort }}
      run: |
        set -o pipefail
        python3 "$GITHUB_ACTION_PATH/scripts/run_ai_review.py" 2>&1 | tee /tmp/ai-review-step.log
        status=${PIPESTATUS[0]}
        if [ "$status" -ne 0 ]; then
          echo "Review with OVH failed: $(tail -n 5 /tmp/ai-review-step.log | tr '\n' ' ')" > /tmp/ai-review-error.txt
          exit "$status"
        fi

    - name: Publish GitHub review
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr_number }}
        REVIEW_MODEL: ${{ inputs.model }}
        REASONING_EFFORT: ${{ inputs.reasoning_effort }}
      run: |
        set -o pipefail
        python3 "$GITHUB_ACTION_PATH/scripts/publish_review.py" 2>&1 | tee /tmp/ai-review-step.log
        status=${PIPESTATUS[0]}
        if [ "$status" -ne 0 ]; then
          echo "Publish GitHub review failed: $(tail -n 5 /tmp/ai-review-step.log | tr '\n' ' ')" > /tmp/ai-review-error.txt
          exit "$status"
        fi

    - name: Capture outcome
      id: outcome
      if: always()
      shell: bash
      run: |
        if [ -f /tmp/ai-review-error.txt ]; then
          ERR=$(cat /tmp/ai-review-error.txt | tr '\n' ' ' | cut -c1-500)
        else
          ERR=""
        fi

        {
          echo "error<<EOF"
          echo "$ERR"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"