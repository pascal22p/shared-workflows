name: Scala AI Review
description: Run the Scala AI review implementation

inputs:
  model:
    description: "The OVH model name"
    required: true
  reasoning_effort:
    description: "Reasoning depth"
    required: true
  temperature:
    description: "Temperature for the AI model"
    required: false
    default: "0.2"
  ovh_api_key:
    description: "OVH AI Endpoints API key"
    required: true
  pr_number:
    description: "Pull request number"
    required: true

runs:
  using: composite
  steps:
    - name: Install Python dependencies
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --quiet protobuf openai

    - name: Build AI review context
      shell: bash
      run: |
        set -euo pipefail

        python3 "$GITHUB_ACTION_PATH/scripts/build_review_context.py" \
          review-context/code-review.md

    - name: Debug AI review context
      shell: bash
      run: |
        set -euo pipefail

        echo "::group::Review parameters"

        echo "model: ${{ inputs.model }}"
        echo "reasoning_effort: ${{ inputs.reasoning_effort }}"
        echo "temperature: ${{ inputs.temperature }}"
        echo "pr_number: ${{ inputs.pr_number }}"

        echo "::endgroup::"

        echo "::group::Review context directory"

        if [ -d "review-context" ]; then
          echo "✓ review-context exists"
          find review-context -type f -print
        else
          echo "✗ review-context DOES NOT EXIST"
        fi

        echo "::endgroup::"

        echo "::group::BEFORE files"

        if [ -d "review-context/before" ]; then
          find review-context/before -type f -print0 |
            while IFS= read -r -d '' file; do
              echo
              echo "========================================"
              echo "FILE: $file"
              echo "========================================"

              if [ -s "$file" ]; then
                echo "STATUS: ✓ present"
                echo "SIZE: $(wc -c < "$file") bytes"
                echo "LINES: $(wc -l < "$file")"
              else
                echo "STATUS: ⚠ present but EMPTY"
              fi

              echo "--- content ---"
              sed -n '1,50p' "$file"
              echo "--- end content ---"
            done
        else
          echo "✗ review-context/before DOES NOT EXIST"
        fi

        echo "::endgroup::"

        echo "::group::AFTER files"

        if [ -d "review-context/after" ]; then
          find review-context/after -type f -print0 |
            while IFS= read -r -d '' file; do
              echo
              echo "========================================"
              echo "FILE: $file"
              echo "========================================"

              if [ -s "$file" ]; then
                echo "STATUS: ✓ present"
                echo "SIZE: $(wc -c < "$file") bytes"
                echo "LINES: $(wc -l < "$file")"
              else
                echo "STATUS: ⚠ present but EMPTY"
              fi

              echo "--- content ---"
              sed -n '1,50p' "$file"
              echo "--- end content ---"
            done
        else
          echo "✗ review-context/after DOES NOT EXIST"
        fi

        echo "::endgroup::"

        echo "::group::Context sent to LLM"

        if [ -f "review-context/code-review.md" ]; then
          echo "✓ code-review.md exists"
          echo "SIZE: $(wc -c < review-context/code-review.md) bytes"
          echo "LINES: $(wc -l < review-context/code-review.md)"

          if [ -s "review-context/code-review.md" ]; then
            echo "STATUS: ✓ contains content"
          else
            echo "STATUS: ⚠ EMPTY"
          fi

          echo
          cat review-context/code-review.md
        else
          echo "✗ code-review.md DOES NOT EXIST"
        fi

        echo "::endgroup::"

    - name: Review with OVH
      shell: bash
      env:
        OVH_AI_ENDPOINTS_API_KEY: ${{ inputs.ovh_api_key }}
        REVIEW_MODEL: ${{ inputs.model }}
        REASONING_EFFORT: ${{ inputs.reasoning_effort }}
        TEMPERATURE: ${{ inputs.temperature }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/scripts/run_ai_review.py"

    - name: Cleanup AI review
      shell: bash
      env:
        OVH_AI_ENDPOINTS_API_KEY: ${{ inputs.ovh_api_key }}
        REVIEW_MODEL: ${{ inputs.model }}
        REASONING_EFFORT: ${{ inputs.reasoning_effort }}
        TEMPERATURE: ${{ inputs.temperature }}
        REVIEW_FILE: review.json
        CLEANUP_OUTPUT_FILE: review-final.json
        CLEANUP_LOG_FILE: review-log.json
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/scripts/cleanup_ai_review.py"

    - name: Publish GitHub review
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr_number }}
        REVIEW_MODEL: ${{ inputs.model }}
        REASONING_EFFORT: ${{ inputs.reasoning_effort }}
        CLEANUP_OUTPUT_FILE: review-final.json
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/scripts/publish_review.py"