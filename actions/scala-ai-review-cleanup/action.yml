name: Scala AI Review Cleanup
description: Validate and clean up findings produced by the Scala AI review

inputs:
  model:
    description: "The OVH model name"
    required: true
  reasoning_effort:
    description: "Reasoning depth for cleanup"
    required: true
  temperature:
    description: "Temperature for the AI model"
    required: false
    default: "0"
  ovh_api_key:
    description: "OVH AI Endpoints API key"
    required: true
  review_file:
    description: "Candidate review JSON to clean up"
    required: true
  output_file:
    description: "Output path for the cleaned review JSON"
    required: true
  log_file:
    description: "Output path for the cleanup decision log"
    required: true

runs:
  using: composite
  steps:
    - name: Install Python dependencies
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --quiet openai

    - name: Cleanup review with OVH
      shell: bash
      env:
        OVH_AI_ENDPOINTS_API_KEY: ${{ inputs.ovh_api_key }}
        MODEL: ${{ inputs.model }}
        REASONING_EFFORT: ${{ inputs.reasoning_effort }}
        TEMPERATURE: ${{ inputs.temperature }}
        REVIEW_FILE: ${{ inputs.review_file }}
        CLEANUP_OUTPUT_FILE: ${{ inputs.output_file }}
        CLEANUP_LOG_FILE: ${{ inputs.log_file }}
      run: |
        set -euo pipefail

        python3 "$GITHUB_ACTION_PATH/scripts/run_ai_cleanup_review.py"

    - name: Debug cleanup output
      shell: bash
      run: |
        set -euo pipefail

        echo "::group::Cleaned review"

        output_file="review-context/${{ inputs.output_file }}"

        if [ -f "$output_file" ]; then
          echo "✓ cleaned review exists"
          echo "SIZE: $(wc -c < "$output_file") bytes"
          echo
          cat "$output_file"
        else
          echo "✗ cleaned review DOES NOT EXIST: $output_file"
          exit 1
        fi

        echo "::endgroup::"

        echo "::group::Cleanup log"

        log_file="review-context/${{ inputs.log_file }}"

        if [ -f "$log_file" ]; then
          echo "✓ cleanup log exists"
          echo "SIZE: $(wc -c < "$log_file") bytes"
          echo
          cat "$log_file"
        else
          echo "✗ cleanup log DOES NOT EXIST: $log_file"
          exit 1
        fi

        echo "::endgroup::"