name: Scala AI Review Publish
description: Publish a Scala AI review to GitHub

inputs:
  model:
    description: "The OVH model name"
    required: true
  reasoning_effort:
    description: "Reasoning depth"
    required: true
  pr_number:
    description: "Pull request number"
    required: true
  review_file:
    description: "Review JSON relative to review-context"
    required: true
  review_title:
    description: "Title of the review"
    required: true

runs:
  using: composite
  steps:
    - name: Publish GitHub review
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/scripts/publish_review.py" \
          --repository "${{ github.repository }}" \
          --pr-number "${{ inputs.pr_number }}" \
          --model "${{ inputs.model }}" \
          --reasoning-effort "${{ inputs.reasoning_effort }}" \
          --review-file "${{ inputs.review_file }}" \
          --review-title "${{ inputs.review_title }}"
