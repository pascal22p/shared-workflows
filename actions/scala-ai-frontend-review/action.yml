name: Scala AI frontend Review
description: Run the Scala AI frontend template review

inputs:
  model:
    description: "The OVH model name"
    required: true

  reasoning_effort:
    description: "Reasoning depth"
    required: true

  temperature:
    description: "Temperature for the AI model"
    required: false
    default: "0.2"

  max_tokens:
    description: "Maximum tokens for the AI model"
    required: false
    default: "40000"

  ovh_api_key:
    description: "OVH AI Endpoints API key"
    required: true

  pr_number:
    description: "Pull request number"
    required: true

runs:
  using: composite

  steps:

    - name: Install Python dependencies
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --quiet openai

    - name: Build AI frontend review context
      shell: bash
      run: |
        set -euo pipefail

        python3 "$GITHUB_ACTION_PATH/scripts/build_frontend_review_context.py" \
          review-context/context-frontend-review.md

    - name: Review frontend elements with OVH
      shell: bash
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/scripts/run_ai_frontend_review.py" \
          --model "${{ inputs.model }}" \
          --reasoning-effort "${{ inputs.reasoning_effort }}" \
          --temperature "${{ inputs.temperature }}" \
          --api-key "${{ inputs.ovh_api_key }}" \
          --max-tokens "${{ inputs.max_tokens }}"
